<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <header>
        <div class="logo-box">
            <a href="index.html">
                <img src="./image/images4.jpg" alt="Plant Store" class="logo">
            </a>
            <h2>GreenHaven Plants</h2>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="product.html">Products</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <h1>Contact Us</h1>
        <p>Have questions about plant care? Send us a message below:</p>
        
        <form id="contactForm" onsubmit="handleFormSubmit(event)" style="margin-top: 20px; display: flex; flex-direction: column; gap: 15px;">
            <div>
                <label>Your Name:</label><br>
                <input type="text" required style="width: 100%; padding: 8px; margin-top: 5px;">
            </div>
            <div>
                <label>Email Address:</label><br>
                <input type="email" required style="width: 100%; padding: 8px; margin-top: 5px;">
            </div>
            <div>
                <label>Message:</label><br>
                <textarea rows="4" required style="width: 100%; padding: 8px; margin-top: 5px;"></textarea>
            </div>
            <button type="submit" style="background-color: #2c5e3b; color: white; padding: 10px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px;">Submit Message</button>
        </form>
    </div>

    <footer>
        <p>&copy; 2026 Online Plant Store</p>
    </footer>

    <script src="./js/script.js"></script>
</body>
</html>
